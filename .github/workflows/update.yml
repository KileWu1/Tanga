name: 每日更新收盤資料
on:
  schedule:
    - cron: '40 7 * * 1-5'
    - cron: '40 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u update.py
      - run: python -u backfill.py
        env:
          BUDGET_MIN: '20'
      - run: |
          git config user.name "kk-ma-tool-bot"
          git config user.email "kk-ma-tool-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "更新收盤資料"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
